# ─────────────────────────────────────────────────────────────────────────────
# ATLAS-OPS Docker Compose — Redis Only
# PostgreSQL runs locally via pgAdmin / native install
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ─── Redis (Caching, Idempotency, Circuit Breaker State) ─────────────────
  redis:
    image: redis:7-alpine
    container_name: atlas_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
